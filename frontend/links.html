<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acortador de Enlaces | AuraFlow Tech</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="loginBox" class="min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <div class="text-center">
        <span class="text-2xl">🔗</span>
        <h1 class="text-lg font-bold text-white mt-1">Acortador de Enlaces</h1>
        <p class="text-xs text-slate-400">auraflowtech.lat/s/...</p>
      </div>
      <input id="passInput" type="password" required placeholder="Contraseña" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
      <p id="loginErr" class="hidden text-xs text-rose-400 text-center"></p>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm">Entrar</button>
    </form>
  </div>

  <div id="appBox" class="hidden max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <a href="/" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">← Inicio</a>
        <h1 class="text-lg font-bold text-white">🔗 Acortador de Enlaces con Clics</h1>
      </div>
      <button onclick="loadLinks()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">🔄 Actualizar</button>
    </header>

    <form id="createForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <div class="sm:col-span-6">
          <label class="block text-xs text-slate-400 mb-1">URL Destino *</label>
          <input id="fUrl" type="url" required placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>
        <div class="sm:col-span-3">
          <label class="block text-xs text-slate-400 mb-1">Alias (opcional)</label>
          <input id="fSlug" type="text" placeholder="ej: promo" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>
        <div class="sm:col-span-3">
          <label class="block text-xs text-slate-400 mb-1">Nota (opcional)</label>
          <input id="fTitle" type="text" placeholder="Ej: Campaña IG" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>
      </div>
      <div class="flex items-center justify-between gap-3">
        <p id="createMsg" class="text-xs text-slate-400"></p>
        <button type="submit" class="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs sm:text-sm">Acortar Enlace</button>
      </div>
    </form>

    <div id="linksList" class="space-y-2.5"></div>
  </div>

  <script>
    let adminPass = sessionStorage.getItem('af_links_pass') || sessionStorage.getItem('af_crm_pass') || '';

    function hdrs() {
      return { 'Content-Type': 'application/json', 'x-admin-password': adminPass };
    }

    async function checkAuth(pass) {
      const r = await fetch('/api/links', { headers: { 'x-admin-password': pass } });
      return r.ok;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('passInput').value;
      if (await checkAuth(pass)) {
        adminPass = pass;
        sessionStorage.setItem('af_links_pass', pass);
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('appBox').classList.remove('hidden');
        loadLinks();
      } else {
        const err = document.getElementById('loginErr');
        err.textContent = 'Contraseña incorrecta.';
        err.classList.remove('hidden');
      }
    });

    if (adminPass) {
      checkAuth(adminPass).then((ok) => {
        if (ok) {
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('appBox').classList.remove('hidden');
          loadLinks();
        }
      });
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('createMsg');
      msg.textContent = 'Creando...';
      const resp = await fetch('/api/links/create', {
        method: 'POST',
        headers: hdrs(),
        body: JSON.stringify({
          url: document.getElementById('fUrl').value.trim(),
          slug: document.getElementById('fSlug').value.trim(),
          title: document.getElementById('fTitle').value.trim()
        })
      });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        msg.className = 'text-xs text-emerald-400 font-semibold';
        msg.textContent = '✅ Creado: ' + data.shortUrl;
        e.target.reset();
        loadLinks();
      } else {
        msg.className = 'text-xs text-rose-400';
        msg.textContent = data.error || 'Error al crear enlace.';
      }
    });

    async function loadLinks() {
      const resp = await fetch('/api/links', { headers: hdrs() });
      if (!resp.ok) return;
      const data = await resp.json();
      const box = document.getElementById('linksList');
      if (!data.links || data.links.length === 0) {
        box.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Aún no hay enlaces creados.</p>';
        return;
      }
      box.innerHTML = data.links.map((l) => {
        const shortUrl = `https://auraflowtech.lat/s/${l.slug}`;
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <a href="${shortUrl}" target="_blank" class="text-sm font-bold text-sky-400 hover:underline">${shortUrl}</a>
                ${l.title ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">${l.title}</span>` : ''}
              </div>
              <p class="text-xs text-slate-400 truncate mt-0.5">${l.target_url}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 text-xs font-bold">👆 ${l.clicks} clics</span>
              <button onclick="navigator.clipboard.writeText('${shortUrl}')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">📋 Copiar</button>
              <button onclick="delLink(${l.id})" class="px-2.5 py-1 rounded-lg bg-rose-600/20 text-rose-300 text-xs">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function delLink(id) {
      await fetch('/api/links/delete', {
        method: 'POST',
        headers: hdrs(),
        body: JSON.stringify({ id })
      });
      loadLinks();
    }
  </script>
</body>
</html>
