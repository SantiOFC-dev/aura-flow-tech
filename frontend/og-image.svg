    <text x="26" y="178" fill="#cbd5e1" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="16.5">• CABYS &amp; IVA Ley 9635</text>
    <text x="26" y="232" fill="#10b981" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="15.5" font-weight="bold">✓ SINCRONIZADO 24/7</text>
  </g>

  <!-- ================= NODO 03: AURAFLOW ID CLOUD ================= -->
  <g transform="translate(800, 226)">
