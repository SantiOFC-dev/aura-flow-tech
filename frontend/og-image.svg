    <text x="26" y="42" fill="#22d3ee" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="15" font-weight="bold" letter-spacing="0.8">NODO 03 • SSO</text>
    <text x="26" y="80" fill="#f8fafc" font-family="DejaVu Sans, Inter, sans-serif" font-size="25" font-weight="bold">AuraFlow ID Cloud</text>
