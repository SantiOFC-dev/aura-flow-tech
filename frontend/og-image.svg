    <text x="26" y="42" fill="#22d3ee" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="15" font-weight="bold" letter-spacing="0.8">NODO 01 • IA</text>
    <text x="26" y="80" fill="#f8fafc" font-family="DejaVu Sans, Inter, sans-serif" font-size="25" font-weight="bold">AuraFlow Builder</text>
    <line x1="26" y1="102" x2="310" y2="102" stroke="#1e293b" stroke-width="1.2" />

    <text x="26" y="142" fill="#94a3b8" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="16.5">• Flujos Visuales WhatsApp</text>
    <text x="26" y="178" fill="#94a3b8" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="16.5">• Agentes Autónomos 24/7</text>
    <text x="26" y="232" fill="#38bdf8" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="14.5" font-weight="bold">✓ MULTI-DEVICE ONLINE</text>
