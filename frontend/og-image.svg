<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#071022" />
      <stop offset="100%" stop-color="#040b18" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="25%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="22%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cardGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#071124" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.48" />
    </pattern>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />

  <!-- Top Badge: AURAFLOW CLOUD ECOSYSTEM -->
  <g transform="translate(64, 42)">
    <rect x="0" y="0" width="368" height="42" rx="21" fill="#071529" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.85" />
    <circle cx="26" cy="21" r="6" fill="#22d3ee" />
    <text x="44" y="27" fill="#38bdf8" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="16" font-weight="bold" letter-spacing="1.2">AURAFLOW CLOUD ECOSYSTEM</text>
  </g>

  <!-- Main Headline (Sized & positioned so "v4.4" fits with generous right margin) -->
  <text x="64" y="140" fill="#f8fafc" font-family="DejaVu Sans, Inter, sans-serif" font-size="37" font-weight="bold" letter-spacing="-0.4">
    AuraFlow Tech — Software, IA &amp; Factura CR v4.4
